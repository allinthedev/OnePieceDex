server {
    listen 80;
    listen [::]:80;
    server_name opdex.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name opdex.eu;
        client_max_body_size 100m;

        resolver 127.0.0.11 valid=10s;

        ssl_certificate     /etc/letsencrypt/live/opdex.eu/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/opdex.eu/privkey.pem;

        location /webhook/topgg {
                set $bot_upstream http://bot:15261;
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_pass $bot_upstream/webhook/topgg;
        }
        location / {
                set $admin_upstream http://admin-panel:8000;
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_pass $admin_upstream;
        }
        location ~ ^/(static|media)/ {
                root /var/www/ballsdex;
        }
}
